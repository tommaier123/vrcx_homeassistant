<!-- VRCX add-on tweaks, inserted into the noVNC page at build time. -->
<style>
    /* Hide the remote desktop side panel (clipboard, scaling, ...). */
    #noVNC_control_bar_anchor { display: none !important; }
</style>
<script type="module">
    // Phones: resize the remote screen to the phone's shape and scale it to
    // fill the screen, without a cursor. Portrait is 640 px wide (2x zoom) and
    // view-only; landscape is 1.75x the phone's real size and fully usable.
    // Desktop browsers only get the zoom block below.
    import UI from "./app/ui.js?v=UNIQUE_VERSION";

    const PORTRAIT_WIDTH = 640;
    const LANDSCAPE_FACTOR = 1.75;

    const sizeFor = ({ w, h }) => w > h
        ? { w: Math.round(w * LANDSCAPE_FACTOR), h: Math.round(h * LANDSCAPE_FACTOR) }
        : { w: PORTRAIT_WIDTH, h: Math.round(PORTRAIT_WIDTH * h / w) };

    const patch = (rfb) => {
        const proto = Object.getPrototypeOf(rfb);
        rfb._requestRemoteResize = function () {
            const real = this._screenSize;
            this._screenSize = () => sizeFor(real.call(this));
            try {
                proto._requestRemoteResize.call(this);
            } finally {
                this._screenSize = real;
            }
        };
        rfb._vrcxPatched = true;
    };

    // Block zooming VRCX (pinch on phones, Ctrl+scroll / Ctrl +/- on desktop),
    // so the layout stays as set up. Caught before noVNC passes them on.
    const block = (ev) => { ev.stopImmediatePropagation(); ev.preventDefault(); };
    for (const type of ["gesturestart", "gesturemove", "gestureend"]) {
        window.addEventListener(type, (ev) => { if (ev.detail?.type === "pinch") block(ev); }, true);
    }
    window.addEventListener("wheel", (ev) => { if (ev.ctrlKey) block(ev); }, { capture: true, passive: false });
    window.addEventListener("keydown", (ev) => {
        if (ev.ctrlKey && ["=", "+", "-", "0"].includes(ev.key)) block(ev);
    }, true);

    if (matchMedia("(pointer: coarse)").matches) {
        setInterval(() => {
            const rfb = UI.rfb;
            if (!rfb) return;
            if (!rfb._vrcxPatched) patch(rfb);
            if (!rfb.scaleViewport) rfb.scaleViewport = true;
            if (!rfb.resizeSession) rfb.resizeSession = true;

            const real = rfb._screenSize();
            const portrait = real.w <= real.h;
            if (portrait && !rfb.viewOnly) {
                // Resize first (view-only blocks resizing), then lock input.
                rfb._requestRemoteResize();
                const t = sizeFor(real);
                if (rfb._fbWidth === t.w && rfb._fbHeight === t.h) {
                    // Park the pointer in the bottom-right corner (out of sight,
                    // no hover effects), then lock input.
                    const c = rfb._canvas;
                    rfb._sendMouse(c.clientWidth, c.clientHeight, 0);
                    rfb.viewOnly = true;
                }
            } else if (!portrait && rfb.viewOnly) {
                rfb.viewOnly = false;
                rfb._requestRemoteResize();
            }
            // No cursor on phones: you tap directly.
            const cursor = rfb._cursor?._canvas;
            if (cursor && cursor.style.display !== "none") cursor.style.display = "none";
        }, 500);
    }
</script>
