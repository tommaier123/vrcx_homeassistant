<!-- VRCX add-on tweaks, inserted into the noVNC page at build time. -->
<style>
    /* Hide the remote desktop side panel (clipboard, scaling, ...). */
    #noVNC_control_bar_anchor { display: none !important; }
</style>
<script type="module">
    // Phones in portrait: resize the remote screen to the phone's shape at
    // 640 px width (2x VRCX's desktop zoom) and scale it to fill the screen.
    // In landscape the screen is left unchanged. Desktop browsers are untouched.
    import UI from "./app/ui.js?v=UNIQUE_VERSION";

    const PORTRAIT_WIDTH = 640;

    const patch = (rfb) => {
        const proto = Object.getPrototypeOf(rfb);
        rfb._requestRemoteResize = function () {
            const real = this._screenSize;
            this._screenSize = () => {
                const { w, h } = real.call(this);
                if (w > h) return { w: this._fbWidth, h: this._fbHeight }; // landscape: keep
                return { w: PORTRAIT_WIDTH, h: Math.round(PORTRAIT_WIDTH * h / w) };
            };
            try {
                proto._requestRemoteResize.call(this);
            } finally {
                this._screenSize = real;
            }
        };
        rfb._vrcxPatched = true;
    };

    // Block zooming VRCX (pinch on phones, Ctrl+scroll / Ctrl +/- on desktop),
    // so the layout stays as set up. Caught before noVNC passes them on.
    const block = (ev) => { ev.stopImmediatePropagation(); ev.preventDefault(); };
    for (const type of ["gesturestart", "gesturemove", "gestureend"]) {
        window.addEventListener(type, (ev) => { if (ev.detail?.type === "pinch") block(ev); }, true);
    }
    window.addEventListener("wheel", (ev) => { if (ev.ctrlKey) block(ev); }, { capture: true, passive: false });
    window.addEventListener("keydown", (ev) => {
        if (ev.ctrlKey && ["=", "+", "-", "0"].includes(ev.key)) block(ev);
    }, true);

    if (matchMedia("(pointer: coarse)").matches) {
        setInterval(() => {
            const rfb = UI.rfb;
            if (!rfb) return;
            if (!rfb._vrcxPatched) patch(rfb);
            if (!rfb.scaleViewport) rfb.scaleViewport = true;
            if (!rfb.resizeSession) rfb.resizeSession = true;
        }, 500);
    }
</script>
