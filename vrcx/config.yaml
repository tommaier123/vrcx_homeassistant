name: VRCX
version: "1.1.6"
slug: vrcx
description: VRCX (VRChat friend tracker) running in a Home Assistant sidebar tab
url: https://github.com/vrcx-team/VRCX
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
